pre-commit:
  commands:
    gitleaks:
      run: |
        gitleaks detect --verbose --redact
    check-changelog:
      run: |
        if git status | grep -Eq 'modified:.*cart$'
        then
          export error="false"
          if ! git diff --staged cart | grep -q 'VERSION'
          then
            echo "Update the version in cart, fool."
            export error="true"
          fi

          if ! git status | grep -q changelog.md
          then
            echo "Update the changelog, fool."
            export error="true"
          fi

          [[ "$error" == "true" ]] && echo "Error encountered, exiting." && exit 1
          [[ "$error" == "false" ]] && echo "No errors encountered." && exit 0
        fi
