name: Validate release changelog

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate-release-changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify version is documented
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^version="([^"]+)"$/\1/p' cart)"
          if [ -z "$version" ] || [ "$(printf '%s\n' "$version" | wc -l)" -ne 1 ]; then
            echo 'cart must define exactly one version="..." variable.' >&2
            exit 1
          fi

          if ! git check-ref-format --allow-onelevel "refs/tags/$version"; then
            echo "version $version is not a valid tag name." >&2
            exit 1
          fi

          if ! grep -Fxq -- "## $version" changelog.md; then
            echo "changelog.md does not contain a ## $version heading." >&2
            exit 1
          fi
